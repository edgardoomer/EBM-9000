# Despliega EBM-9000 en GitHub Pages en cada push a main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Después, vuelve a ejecutar este flujo (Actions → Re-run jobs) o haz un nuevo push.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar sitio estático
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Pages todavía no está habilitado
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=Habilita GitHub Pages::GitHub Pages aún no está habilitado en este repositorio. Ve a Settings → Pages → Build and deployment → Source y elige 'GitHub Actions'. Luego vuelve a ejecutar este flujo (Re-run jobs) o haz un nuevo push a main."
          exit 1

      - name: Empaquetar el sitio (raíz del repositorio)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
