# Despliega EBM-9000 en GitHub Pages en cada push a main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Si Pages no está habilitado (por ejemplo, porque el sitio se publica en Netlify), el flujo
# termina con un aviso y omite el despliegue en lugar de fallar.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar sitio estático
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Pages todavía no está habilitado (se omite el despliegue)
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages no habilitado::Se omitió el despliegue en Pages. Para activarlo: Settings → Pages → Build and deployment → Source: 'GitHub Actions' y vuelve a ejecutar el flujo. Si publicas en Netlify, puedes ignorar este aviso."
          {
            echo "## ⚠️ GitHub Pages no está habilitado"
            echo "Se omitió el despliegue. Para activarlo: **Settings → Pages → Build and deployment → Source: GitHub Actions** y vuelve a ejecutar este flujo."
            echo "Si el sitio se publica en Netlify, este aviso se puede ignorar (o desactivar el flujo en Actions)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Empaquetar el sitio (raíz del repositorio)
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
