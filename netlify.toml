# EBM-9000 · Netlify
# Sitio 100 % estático: no hay comando de build; se publica la raíz del repositorio.
# Importa el repositorio desde app.netlify.com y despliega sin cambiar nada.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
